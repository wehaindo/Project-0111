[options]
# Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False

# Addons path
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Server settings
http_port = 28069
longpolling_port = 28072

# Logging
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO

# Performance
workers = 0
max_cron_threads = 1

# Security
admin_passwd = admin
list_db = True

# Session
session_timeout = 3600

# Limits
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

# Development
dev_mode = reload,qweb,werkzeug,xml
