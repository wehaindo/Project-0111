services:
  # PostgreSQL Database
  db:
    image: postgres:13
    container_name: odoo13_postgres
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "25432:5432"
    networks:
      - odoo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Odoo 13
  odoo:
    image: odoo:13.0
    container_name: odoo13_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "28069:8069"
      - "28072:8072"  # Longpolling port
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      # Mount custom addons (your POS module)
      - ./weha_pos_self_sync:/mnt/extra-addons/weha_pos_self_sync
      # Odoo data persistence
      - odoo-web-data:/var/lib/odoo
      # Custom config
      - ./odoo.conf:/etc/odoo/odoo.conf
      # Logs
      - ./logs:/var/log/odoo
    networks:
      - odoo-network
    restart: unless-stopped
    command: odoo --log-level=info --workers=0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  odoo-web-data:
    driver: local
  odoo-db-data:
    driver: local

networks:
  odoo-network:
    driver: bridge
